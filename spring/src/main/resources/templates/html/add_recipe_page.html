<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>레시피 등록</title>
    <link rel="stylesheet" href="{{@{/static/css/task_htmlcss.css}}}"/>
</head>
<body>
<header>
    <img src="{{@{/static/img/logo.svg}}}" alt="샘표 로고" class="logo"/>
</header>
<main>
    <h2>레시피 등록</h2>
    <form action="/addRecipe" method="post">
        <input type="text" name="name" placeholder="레시피 이름" required/><br/>
        <input type="text" name="type" placeholder="레시피 유형" required/><br/>
        <textarea name="detail" placeholder="상세 설명" required></textarea><br/>
        <input type="url" name="img" placeholder="이미지 URL" required/><br/>
        <button type="submit">등록</button>
    </form>
</main>
</body>
</html>
